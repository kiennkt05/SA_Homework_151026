services:
  gateway:
    build: ./services/gateway
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-change-me-for-production}
      USER_SERVICE_URL: http://users:3001
      ORDER_SERVICE_URL: http://orders:3002
    ports:
      - "8080:8080"
    depends_on:
      users:
        condition: service_healthy
      orders:
        condition: service_healthy

  users:
    build: ./services/users
    environment:
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-change-me-for-production}
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: avatars
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  orders:
    build: ./services/orders
    environment:
      PORT: 3002
    ports:
      - "127.0.0.1:3002:3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123}; do sleep 1; done;
      mc mb --ignore-existing local/avatars;
      exit 0;
      "

volumes:
  minio-data:

